[project]
name = "scartissue-modal-evaluation"
version = "0.1.0"
description = "Locked remote runtime for reproducing existing Cohere patches and lm-eval capability measurements"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.0",
  "transformers==5.22.0",
  "accelerate==1.11.0",
  "huggingface-hub==1.33.0",
  "datasets==4.4.2",
  "lm-eval[hf]==0.4.13",
  "numpy",
  "sentencepiece",
  "tiktoken",
  "pytest",
]

[tool.uv]
package = false
# This environment is materialised only in Modal, not on the laptop.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
