[project]
name = "scartissue-window"
version = "0.1.0"
description = "Lexsi Track 2: circuit-restricted repair of abliterated Cohere checkpoints"
readme = "README.md"
authors = [
    { name = "amugoodbad229", email = "ayman.khan1971@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "modal>=1.6.3",
]

[tool.pytest.ini_options]
pythonpath = [".", "experiments"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "playwright>=1.64.1",
    "pymupdf>=2.0",
    "pytest>=9.2.0",
    "torch>=2.15.0",
]
